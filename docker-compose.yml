version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sbm_db
    environment:
      POSTGRES_DB: sbm_db
      POSTGRES_USER: sbm_user
      POSTGRES_PASSWORD: sbm_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbm_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sbm_db
      DB_USER: sbm_user
      DB_PASSWORD: sbm_password_123
      DB_URL: postgresql://sbm_user:sbm_password_123@postgres:5432/sbm_db
      JWT_SECRET: your_super_secure_jwt_secret_key_here_change_in_production
      CLIENT_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbm_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
    driver: local
